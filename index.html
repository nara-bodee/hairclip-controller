<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0b0c0e"
  >

  <title>HairClip Controller</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <main class="app">

    <header>
      <p class="eyebrow">
        BLE CONTROLLER
      </p>

      <h1>
        Hair Clip
      </h1>

      <div
        id="statusBadge"
        class="status-badge disconnected"
      >
        <span class="status-dot"></span>

        <span id="statusText">
          Disconnected
        </span>
      </div>
    </header>


    <button
      id="connectButton"
      class="connect-button"
    >
      Connect HairClip
    </button>


    <!-- BATTERY -->

    <section class="battery-card">

      <div class="battery-top">

        <div>
          <span class="battery-label">
            BATTERY
          </span>

          <strong id="batteryPercent">
            --%
          </strong>
        </div>

        <span id="batteryVoltage">
          --.-- V
        </span>

      </div>


      <div class="battery-track">

        <div
          id="batteryFill"
          class="battery-fill"
        ></div>

      </div>


      <p class="battery-note">
        Estimated from LiPo voltage
      </p>

    </section>


    <!-- MESSAGE -->

    <section class="card">

      <div class="section-header">

        <label for="messageInput">
          Message
        </label>

        <span id="characterCount">
          0 / 100
        </span>

      </div>


      <input
        id="messageInput"
        type="text"
        placeholder="Type your message..."
        maxlength="100"
        autocomplete="off"
        disabled
      >


      <div class="icon-section">

        <span class="icon-label">
          Icons
        </span>

        <div
          class="icon-picker"
        >

          <button
            type="button"
            class="icon-button"
            data-token=":heart:"
            disabled
          >
            ♥
          </button>

          <button
            type="button"
            class="icon-button"
            data-token=":star:"
            disabled
          >
            ★
          </button>

          <button
            type="button"
            class="icon-button"
            data-token=":smile:"
            disabled
          >
            ☺
          </button>

          <button
            type="button"
            class="icon-button"
            data-token=":sun:"
            disabled
          >
            ☀
          </button>

          <button
            type="button"
            class="icon-button"
            data-token=":moon:"
            disabled
          >
            ☾
          </button>

          <button
            type="button"
            class="icon-button"
            data-token=":music:"
            disabled
          >
            ♪
          </button>

        </div>

      </div>


      <button
        id="sendButton"
        class="send-button"
        disabled
      >
        Send Message
      </button>

    </section>


    <!-- CONTROLS -->

    <section class="card">

      <div class="control-row">

        <div>
          <strong>
            Scrolling
          </strong>

          <p>
            Long messages scroll automatically
          </p>
        </div>

        <label class="switch">

          <input
            id="scrollToggle"
            type="checkbox"
            checked
            disabled
          >

          <span class="slider"></span>

        </label>

      </div>


      <div class="divider"></div>


      <div class="control-row">

        <div>
          <strong>
            Display
          </strong>

          <p>
            Turn the screen on or off
          </p>
        </div>

        <label class="switch">

          <input
            id="displayToggle"
            type="checkbox"
            checked
            disabled
          >

          <span class="slider"></span>

        </label>

      </div>

    </section>


    <div class="activity">

      <span>
        Activity
      </span>

      <p id="log">
        Waiting for connection
      </p>

    </div>

  </main>


  <script src="app.js"></script>

</body>

</html>
