<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HairClip Controller</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <header>
      <p class="eyebrow">BLE CONTROLLER</p>
      <h1>Hair Clip</h1>

      <div id="statusBadge" class="status-badge disconnected">
        <span class="status-dot"></span>
        <span id="statusText">Disconnected</span>
      </div>
    </header>


    <button
      id="connectButton"
      class="connect-button"
    >
      Connect HairClip
    </button>


    <section class="card">

      <div class="section-header">
        <label for="messageInput">
          Message
        </label>

        <span id="characterCount">
          0 / 100
        </span>
      </div>

      <input
        id="messageInput"
        type="text"
        placeholder="Type your message..."
        maxlength="100"
        disabled
      >

      <button
        id="sendButton"
        class="send-button"
        disabled
      >
        Send Message
      </button>

    </section>


    <section class="card">

      <div class="control-row">

        <div>
          <strong>Scrolling</strong>
          <p>Move text across the display</p>
        </div>

        <label class="switch">
          <input
            id="scrollToggle"
            type="checkbox"
            checked
            disabled
          >
          <span class="slider"></span>
        </label>

      </div>


      <div class="divider"></div>


      <div class="control-row">

        <div>
          <strong>Display</strong>
          <p>Turn the screen on or off</p>
        </div>

        <label class="switch">
          <input
            id="displayToggle"
            type="checkbox"
            checked
            disabled
          >
          <span class="slider"></span>
        </label>

      </div>

    </section>


    <div class="activity">

      <span>Activity</span>

      <p id="log">
        Waiting for connection
      </p>

    </div>

  </main>


  <script src="app.js"></script>

</body>
</html>
