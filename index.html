<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0b0c0e"
  >

  <title>
    HairClip Controller
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

  <main class="app">

    <!-- HEADER -->

    <header>

      <p class="eyebrow">
        BLE CONTROLLER
      </p>

      <h1>
        Hair Clip
      </h1>

      <div
        id="statusBadge"
        class="status-badge disconnected"
      >

        <span
          class="status-dot"
        ></span>

        <span
          id="statusText"
        >
          Disconnected
        </span>

      </div>

    </header>


    <!-- CONNECT -->

    <button
      id="connectButton"
      class="connect-button"
    >
      Connect HairClip
    </button>


    <!-- MESSAGE -->

    <section class="card">

      <div class="section-header">

        <label for="messageInput">
          Message
        </label>

        <span id="characterCount">
          0 / 100
        </span>

      </div>

      <input
        id="messageInput"
        type="text"
        placeholder="Type your message..."
        maxlength="100"
        autocomplete="off"
        disabled
      >

      <button
        id="sendButton"
        class="send-button"
        disabled
      >
        Send Message
      </button>

      <p class="message-hint">
        Supports Thai, English and icon tokens such as
        :heart: :star: :smile:
      </p>

    </section>


    <!-- CONTROLS -->

    <section class="card">

      <!-- SCROLL -->

      <div class="control-row">

        <div>

          <strong>
            Scrolling
          </strong>

          <p>
            Long messages will keep scrolling automatically
          </p>

        </div>

        <label class="switch">

          <input
            id="scrollToggle"
            type="checkbox"
            checked
            disabled
          >

          <span
            class="slider"
          ></span>

        </label>

      </div>


      <div class="divider"></div>


      <!-- DISPLAY -->

      <div class="control-row">

        <div>

          <strong>
            Display
          </strong>

          <p>
            Turn the screen on or off
          </p>

        </div>

        <label class="switch">

          <input
            id="displayToggle"
            type="checkbox"
            checked
            disabled
          >

          <span
            class="slider"
          ></span>

        </label>

      </div>

    </section>


    <!-- ACTIVITY -->

    <div class="activity">

      <span>
        Activity
      </span>

      <p id="log">
        Waiting for connection
      </p>

    </div>

  </main>


  <script src="app.js"></script>

</body>

</html>
